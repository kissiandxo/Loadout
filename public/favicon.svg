<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Square mark (for favicon, social avatar, app icon contexts) -->
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8BFF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#0A0A0B" rx="32"/>
  <!-- Stylised "L" with the accent dot -->
  <path d="M 60 50 L 60 130 L 132 130"
        stroke="#F4F4F5"
        stroke-width="14"
        fill="none"
        stroke-linecap="square"
        stroke-linejoin="miter"/>
  <circle cx="142" cy="130" r="11" fill="url(#accentGrad)"/>
</svg>
