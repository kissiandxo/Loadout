<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Gumroad cover — Full Loadout Bundle (both kits). 1280x720 16:9 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="100%" stop-color="#15151A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8BFF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4F8BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <circle cx="640" cy="360" r="450" fill="url(#glowGrad)"/>

  <g stroke="#4F8BFF" stroke-width="1" opacity="0.04">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
  </g>

  <!-- Loadout wordmark, larger, centered top -->
  <g transform="translate(640, 130)">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="56" letter-spacing="-2" fill="#F4F4F5" text-anchor="middle">Loadout</text>
    <circle cx="138" cy="-12" r="7" fill="url(#accentGrad)"/>
  </g>

  <!-- Eyebrow pill -->
  <g transform="translate(440, 175)">
    <rect x="0" y="0" width="400" height="36" rx="18" fill="#4F8BFF" fill-opacity="0.12" stroke="#4F8BFF" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#4F8BFF"/>
    <text x="34" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="13" letter-spacing="1" fill="#4F8BFF" text-anchor="start">THE FULL BUNDLE · BOTH KITS · SAVE $45</text>
  </g>

  <!-- Main headline -->
  <text x="640" y="320" font-family="Inter, sans-serif" font-weight="900" font-size="86" letter-spacing="-3" fill="#F4F4F5" text-anchor="middle">24 AI staff.</text>
  <text x="640" y="410" font-family="Inter, sans-serif" font-weight="900" font-size="86" letter-spacing="-3" fill="#4F8BFF" text-anchor="middle">One install.</text>

  <!-- Two kits laid out side-by-side -->
  <g transform="translate(120, 480)">
    <!-- Kit 1 -->
    <g>
      <rect x="0" y="0" width="490" height="180" rx="12" fill="#1A1A20" stroke="#27272A" stroke-width="1"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#F4F4F5">The Sales Loadout</text>
      <text x="24" y="68" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#A1A1AA">12 agents · 8 plugins · for any sales role</text>
      <text x="24" y="130" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4F8BFF" font-weight="500">/follow-up  /objection  /negotiate</text>
      <text x="24" y="152" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4F8BFF" font-weight="500">/proposal  /pipeline  /cold  + 6 more</text>
    </g>

    <!-- Kit 2 -->
    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="490" height="180" rx="12" fill="#1A1A20" stroke="#27272A" stroke-width="1"/>
      <text x="24" y="38" font-family="Inter, sans-serif" font-weight="700" font-size="20" fill="#F4F4F5">The Customer Engagement Loadout</text>
      <text x="24" y="68" font-family="Inter, sans-serif" font-weight="400" font-size="14" fill="#A1A1AA">12 agents · 8 plugins · plus website chatbot stack</text>
      <text x="24" y="130" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4F8BFF" font-weight="500">/chatbot  /triage  /faq  /review</text>
      <text x="24" y="152" font-family="'JetBrains Mono', monospace" font-size="13" fill="#4F8BFF" font-weight="500">/complaint  /refund  + 6 more</text>
    </g>
  </g>

  <!-- Price tag (top-right) -->
  <g transform="translate(1080, 60)">
    <rect x="0" y="0" width="140" height="64" rx="10" fill="#1A1A20" stroke="#4F8BFF" stroke-width="1.5"/>
    <text x="70" y="36" font-family="Inter, sans-serif" font-weight="900" font-size="32" fill="#F4F4F5" text-anchor="middle">$149</text>
    <text x="70" y="54" font-family="Inter, sans-serif" font-weight="500" font-size="10" letter-spacing="1.5" fill="#A1A1AA" text-anchor="middle">BOTH KITS</text>
  </g>
</svg>
