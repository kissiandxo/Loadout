<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Option 1 — "Stack" (abstract E): vertical stem + three rounded bars.
       Reads as an E and as a loaded stack of modules. Faithful to the
       uploaded mark's structure, stripped of gothic/serif/sparkle cues. -->
  <rect width="200" height="200" rx="46" fill="#0A0A0B"/>
  <g fill="#FFFFFF">
    <rect x="50" y="50"  width="22" height="100" rx="11"/>
    <rect x="50" y="50"  width="100" height="22" rx="11"/>
    <rect x="50" y="89"  width="74"  height="22" rx="11"/>
    <rect x="50" y="128" width="96"  height="22" rx="11"/>
  </g>
</svg>
