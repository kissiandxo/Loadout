# LOADOUT — Growth Autopilot · n8n runtime
# Brings up n8n 24/7 in Docker. All credentials/settings come from ../config.env.
#   docker compose -f install/docker-compose.yml up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: loadout-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Pull every value from the buyer's credential vault. (env_file needs a real
    # config.env — copy config.env.template first.)
    env_file:
      - ../config.env
    environment:
      # let workflow expressions read {{$env.X}} from the vault above
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n          # persistent: workflows, creds, executions
      - ./_runtime:/data                  # installer scratch (gitignored)
      - ../workflows:/workflows:ro        # the 30 workers, read-only
volumes:
  n8n_data:
